services:
  - type: web
    name: keyauth-server
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          name: keyauth-redis
          type: redis
          property: connectionString

databases:
  - type: redis
    name: keyauth-redis
    plan: free
    ipAllowList: []
